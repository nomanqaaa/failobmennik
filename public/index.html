<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Защищённый файлообменник</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--muted:#697180;--border:#e0e4eb;--accent:#3b5bfd;--good:#16803c;--bad:#c62828} @media(prefers-color-scheme:dark){:root{--bg:#101217;--card:#1a1d24;--text:#eef0f4;--muted:#a4aab5;--border:#333844;--accent:#8394ff;--good:#68d391;--bad:#ff8585}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding:28px 14px 60px}.wrap{max-width:580px;margin:auto}h1{font-size:22px;margin:0 0 5px}.sub,.note{font-size:13px;color:var(--muted);line-height:1.55}.sub{margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:14px 0}label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}input[type=file]{padding:10px}button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:650;cursor:pointer;margin-top:16px}button:disabled{opacity:.55;cursor:wait}.drop{border:1.5px dashed var(--border);border-radius:11px;padding:20px;text-align:center}.msg{font-size:13px;line-height:1.5;margin-top:12px;overflow-wrap:anywhere}.err{color:var(--bad)}.ok{color:var(--good)}.link{display:flex;gap:8px}.link input{min-width:0}.link button{width:auto;white-space:nowrap;margin-top:0}.timer{text-align:center;font-size:20px;font-weight:700;margin:8px}.note{margin-top:14px}.badge{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:4px 9px;display:inline-block;margin:0 5px 5px 0}
</style></head><body><main class="wrap"><h1>🔒 Защищённый файлообменник</h1><div class="sub">Файл шифруется в браузере до загрузки. Получатель открывает ссылку и вводит пароль.</div><div id="app"></div><p class="note">Прототип для самостоятельного развёртывания. После публикации сайт доступен всем, у кого есть ссылка на сайт. Не загружайте незаконные или чужие конфиденциальные материалы.</p></main>
<script>
const API='/api';const enc=new TextEncoder();const b64={enc:b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)},dec:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0))};const fmt=n=>n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ';const durations={h:3600,d:86400,w:604800};
async function keyFor(password,salt,usage){const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,[usage])}
function message(id,text,kind=''){const e=document.getElementById(id);if(e)e.innerHTML=`<div class="msg ${kind}">${text}</div>`}
function home(){document.getElementById('app').innerHTML=`<section class="card"><label for="file">Файл (до 18 МБ)</label><div class="drop"><input id="file" type="file" aria-label="Выбрать файл"></div><label for="pass">Пароль для получателя</label><input id="pass" type="password" autocomplete="new-password" placeholder="Используйте длинный пароль" minlength="10"><label for="dur">Срок действия ссылки</label><select id="dur"><option value="h">1 час</option><option value="d" selected>1 день</option><option value="w">7 дней</option></select><button id="send">Зашифровать и загрузить</button><div id="out"></div></section><p class="note">Передайте пароль получателю отдельно от ссылки. Если пароль потерян, восстановить файл нельзя.</p>`;document.getElementById('send').onclick=create}
async function create(){const file=document.getElementById('file').files[0],pass=document.getElementById('pass').value,dur=document.getElementById('dur').value,out=document.getElementById('out'),btn=document.getElementById('send');if(!file){message('out','Сначала выберите файл.','err');return}if(file.size>18*1024*1024){message('out','Максимальный размер файла — 18 МБ в бесплатной версии.','err');return}if(pass.length<10){message('out','Пароль должен содержать не менее 10 символов.','err');return}if(!crypto.subtle){message('out','Для шифрования откройте сайт по HTTPS.','err');return}btn.disabled=true;message('out','Шифрование файла в браузере…');try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await keyFor(pass,salt,'encrypt'),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,await file.arrayBuffer());const payload={filename:file.name,mime:file.type||'application/octet-stream',size:file.size,salt:b64.enc(salt),iv:b64.enc(iv),ciphertext:b64.enc(cipher),ttl:durations[dur]};message('out','Загрузка зашифрованного файла…');const r=await fetch(API+'/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить файл');const link=location.origin+location.pathname+'#'+data.token;out.innerHTML=`<div class="msg ok">Файл зашифрован и загружен.</div><label>Ссылка для получателя</label><div class="link"><input id="share" readonly value="${link}"><button id="copy">Копировать</button></div><p class="note">Пароль сообщите получателю другим способом. Ссылка удаляется после скачивания или по истечении срока.</p>`;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.getElementById('copy').textContent='Скопировано'}catch{document.getElementById('share').select()}}}catch(e){message('out',String(e.message||e),'err')}finally{btn.disabled=false}}
async function receive(token){document.getElementById('app').innerHTML='<section class="card" id="recv">Загрузка сведений о файле…</section>';const box=document.getElementById('recv');try{const r=await fetch(API+'/file/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Ссылка недействительна или срок её действия истёк');box.innerHTML=`<span class="badge">${escapeHtml(d.filename)}</span><span class="badge">${fmt(d.size)}</span><div class="timer" id="timer"></div><label for="rpass">Пароль от отправителя</label><input id="rpass" type="password" autocomplete="current-password"><button id="get">Расшифровать и скачать</button><div id="rout"></div><p class="note">После успешного скачивания ссылка будет удалена. Если пароль введён неверно, файл останется доступен до истечения срока.</p>`;const tick=()=>{const n=Math.max(0,d.expiresAt-Date.now());document.getElementById('timer').textContent=n?`${Math.floor(n/3600000)}ч ${Math.floor(n%3600000/60000)}м ${Math.floor(n%60000/1000)}с до удаления`:'Срок истёк'};tick();const timer=setInterval(tick,1000);document.getElementById('get').onclick=async()=>{const btn=document.getElementById('get'),pass=document.getElementById('rpass').value;btn.disabled=true;message('rout','Расшифровка…');try{const key=await keyFor(pass,b64.dec(d.salt),'decrypt');let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64.dec(d.iv)},key,b64.dec(d.ciphertext))}catch{throw Error('Неверный пароль. Проверьте раскладку и повторите попытку.')}const blob=new Blob([plain],{type:d.mime||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=d.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);const cr=await fetch(API+'/consume/'+encodeURIComponent(token),{method:'POST'});if(!cr.ok)throw Error('Файл скачан, но сервер не подтвердил удаление ссылки.');clearInterval(timer);message('rout','Файл скачан. Ссылка больше не действует.','ok');btn.textContent='Ссылка использована'}catch(e){message('rout',escapeHtml(String(e.message||e)),'err');btn.disabled=false}}}catch(e){box.innerHTML=`<div class="msg err">${escapeHtml(String(e.message||e))}</div><button class="secondary" onclick="location.hash='';home()">К отправке файла</button>`}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const token=location.hash.slice(1);if(token)receive(token);else home();window.addEventListener('hashchange',()=>location.hash?receive(location.hash.slice(1)):home());
</script></body></html>
